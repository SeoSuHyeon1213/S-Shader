##############################################
# Buffer Formats
##############################################

# colortex0-3 formats are GLSL loader directives declared in composite.fsh.
# Bare colortexNFormat properties are not read here.

# Material/normal alpha is an ownership flag in the translucent pass: water writes 1 and replaces
# the opaque data, other translucents (stained glass, ice) write 0 and keep the terrain behind them.
blend.gbuffers_water.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex3 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Hands, held items and entities may draw with a translucent render type and blending on (the first-person
# arm does in 26.x). Their zero-alpha masks must replace the terrain data behind them, or final shades them
# with that terrain's shadows, lava glow and wet effects and they look see-through.
blend.gbuffers_hand.colortex2 = off
blend.gbuffers_hand.colortex3 = off
blend.gbuffers_hand_water.colortex2 = off
blend.gbuffers_hand_water.colortex3 = off
blend.gbuffers_entities.colortex2 = off
blend.gbuffers_entities.colortex3 = off

##############################################
# Shadows
##############################################

# Resolution, distance, snapping and depth sampling are GLSL loader constants.
# See lib/shadow_settings.glsl; bare properties do not configure these values.

##############################################
# Shader Options Screen
##############################################

screen = SHADOW_MODE shadowDistance shadowMapResolution SHADOW_STRENGTH WAVING_PLANTS WATER_REFLECTION_MODE ENABLE_CONTACT_SHADOWS ENABLE_NORMAL_FORM_LIGHTING ENABLE_WET_GROUND_LAYER ENABLE_WET_SCREEN_REFLECTIONS ENABLE_WET_SPECULAR ENABLE_WATER_SURFACE <profile> <empty> WAVING_STRENGTH EXPOSURE CONTRAST SATURATION LIGHTING_STRENGTH DAY_LIGHT_STRENGTH NIGHT_LIGHT_STRENGTH SUNSET_GLOW_STRENGTH TORCH_LIGHT_INTENSITY LAVA_EMISSION_INTENSITY CONTACT_SHADOW_INTENSITY RAIN_REFLECTION_INTENSITY WATER_REFLECTION_INTENSITY BLOOM_INTENSITY BLOOM_THRESHOLD FOG_DENSITY FOG_START AERIAL_FOG_STRENGTH VIGNETTE_OUTER

sliders = shadowDistance shadowMapResolution SHADOW_STRENGTH WAVING_STRENGTH EXPOSURE CONTRAST SATURATION LIGHTING_STRENGTH DAY_LIGHT_STRENGTH NIGHT_LIGHT_STRENGTH SUNSET_GLOW_STRENGTH TORCH_LIGHT_INTENSITY LAVA_EMISSION_INTENSITY CONTACT_SHADOW_INTENSITY RAIN_REFLECTION_INTENSITY WATER_REFLECTION_INTENSITY BLOOM_INTENSITY BLOOM_THRESHOLD FOG_DENSITY FOG_START AERIAL_FOG_STRENGTH VIGNETTE_OUTER
