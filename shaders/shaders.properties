##############################################
# Buffer Formats
##############################################

# colortex0-3 formats are GLSL loader directives declared in composite.fsh.
# Bare colortexNFormat properties are not read here.

# Water alpha blends scene color, but must not dilute material/normal ownership.
blend.gbuffers_water.colortex2 = off
blend.gbuffers_water.colortex3 = off

##############################################
# Shadows
##############################################

# Resolution, distance, snapping and depth sampling are GLSL loader constants.
# See lib/shadow_settings.glsl; bare properties do not configure these values.

##############################################
# Shader Options Screen
##############################################

screen = SHADOW_MODE shadowDistance SHADOW_STRENGTH WATER_REFLECTION_MODE ENABLE_CONTACT_SHADOWS ENABLE_NORMAL_FORM_LIGHTING ENABLE_WET_GROUND_LAYER ENABLE_WET_SCREEN_REFLECTIONS ENABLE_WET_SPECULAR ENABLE_WATER_SURFACE <profile> <empty> EXPOSURE CONTRAST SATURATION LIGHTING_STRENGTH DAY_LIGHT_STRENGTH NIGHT_LIGHT_STRENGTH SUNSET_GLOW_STRENGTH TORCH_LIGHT_INTENSITY LAVA_EMISSION_INTENSITY CONTACT_SHADOW_INTENSITY RAIN_REFLECTION_INTENSITY WATER_REFLECTION_INTENSITY BLOOM_INTENSITY BLOOM_THRESHOLD FOG_DENSITY FOG_START VIGNETTE_OUTER

sliders = shadowDistance SHADOW_STRENGTH EXPOSURE CONTRAST SATURATION LIGHTING_STRENGTH DAY_LIGHT_STRENGTH NIGHT_LIGHT_STRENGTH SUNSET_GLOW_STRENGTH TORCH_LIGHT_INTENSITY LAVA_EMISSION_INTENSITY CONTACT_SHADOW_INTENSITY RAIN_REFLECTION_INTENSITY WATER_REFLECTION_INTENSITY BLOOM_INTENSITY BLOOM_THRESHOLD FOG_DENSITY FOG_START VIGNETTE_OUTER
