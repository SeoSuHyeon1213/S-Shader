##############################################
# Buffer Formats
##############################################

# colortex0-3 formats are GLSL loader directives declared in composite.fsh.
# Bare colortexNFormat properties are not read here.

# Material/normal alpha is an ownership flag in the translucent pass: water writes 1 and replaces
# the opaque data, other translucents (stained glass, ice) write 0 and keep the terrain behind them.
blend.gbuffers_water.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex3 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

##############################################
# Shadows
##############################################

# Resolution, distance, snapping and depth sampling are GLSL loader constants.
# See lib/shadow_settings.glsl; bare properties do not configure these values.

##############################################
# Shader Options Screen
##############################################

screen = SHADOW_MODE shadowDistance SHADOW_STRENGTH WAVING_PLANTS WATER_REFLECTION_MODE ENABLE_CONTACT_SHADOWS ENABLE_NORMAL_FORM_LIGHTING ENABLE_WET_GROUND_LAYER ENABLE_WET_SCREEN_REFLECTIONS ENABLE_WET_SPECULAR ENABLE_WATER_SURFACE <profile> <empty> WAVING_STRENGTH EXPOSURE CONTRAST SATURATION LIGHTING_STRENGTH DAY_LIGHT_STRENGTH NIGHT_LIGHT_STRENGTH SUNSET_GLOW_STRENGTH TORCH_LIGHT_INTENSITY LAVA_EMISSION_INTENSITY CONTACT_SHADOW_INTENSITY RAIN_REFLECTION_INTENSITY WATER_REFLECTION_INTENSITY BLOOM_INTENSITY BLOOM_THRESHOLD FOG_DENSITY FOG_START VIGNETTE_OUTER

sliders = shadowDistance SHADOW_STRENGTH WAVING_STRENGTH EXPOSURE CONTRAST SATURATION LIGHTING_STRENGTH DAY_LIGHT_STRENGTH NIGHT_LIGHT_STRENGTH SUNSET_GLOW_STRENGTH TORCH_LIGHT_INTENSITY LAVA_EMISSION_INTENSITY CONTACT_SHADOW_INTENSITY RAIN_REFLECTION_INTENSITY WATER_REFLECTION_INTENSITY BLOOM_INTENSITY BLOOM_THRESHOLD FOG_DENSITY FOG_START VIGNETTE_OUTER
